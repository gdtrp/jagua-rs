name: Build, Push, and Deploy Jagua SQS Processor

# Triggers
#   - push to STAGING_BRANCH      → build :staging  → deploy staging
#   - push to main or live-v* tag → build :production (also tagged :staging) → deploy prod AND staging

on:
  push:
    tags:
      - 'live-v[0-9]+.[0-9]+.[0-9]+'
    # Match every branch — GitHub Actions doesn't allow ${{ }} in trigger
    # filters, so we can't reference env.STAGING_BRANCH here. Instead we
    # trigger on all branches and let each job's `if:` gate the actual work
    # against STAGING_BRANCH / main / live-v* tags. Cost: a short `config`
    # runner fires on every branch push, but nothing else runs unless the
    # branch matches.
    branches:
      - '**'
  workflow_dispatch:

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: jagua-sqs-processor
  IMAGE_TAG: ${{ github.sha }}
  # Single source of truth for the staging branch name. Exported by the
  # `config` job as an output so other jobs can reference it from their `if:`
  # conditions (GitHub Actions does not expose `env.*` to job-level `if:`
  # expressions — only `needs.*.outputs.*` works there). The `on.push.branches`
  # trigger above matches `**` so renames here take effect with no other edits.
  STAGING_BRANCH: chore/consume-cutl-schemas
  # ─────────────── VK Cloud migration (T7) ───────────────
  # Built once, pushed to BOTH registries for the length of the overlap.
  #
  # linux/amd64 ONLY, unlike the backend and frontend which went multi-arch.
  # Not an oversight: CutlEnvironmentStack.java:1028 records that "Jagua
  # processor stays on x86_64 due to build issues with ARM", so its ECS task is
  # already x86_64, and VK worker nodes are amd64 too. Nothing here wants arm64.
  # ONE REGISTRY FOR THE ESTATE, owned by the production cluster and consumed by
  # staging too. Staging used to run its own at registry.staging.cutl.online;
  # that was removed, so this name is the only one that resolves to a registry.
  #
  # VK_REGISTRY_USER / VK_REGISTRY_PASSWORD therefore hold the PRODUCTION
  # registry's credentials, at repository scope, for both environments' jobs.
  VK_REGISTRY: registry.cutl.online
  VK_IMAGE: jagua-sqs-processor
  # Pushing this branch builds and rolls the VK cluster without touching ECR or
  # main, so the platform can be exercised before any of it merges.
  VK_DEPLOY_BRANCH: vk-cloud

jobs:
  # ---------------------------------------------------------------------------
  # Surfaces env.STAGING_BRANCH to downstream jobs' `if:` expressions, which
  # can't read `env.*` directly.
  # ---------------------------------------------------------------------------
  config:
    runs-on: ubuntu-latest
    outputs:
      staging_branch: ${{ env.STAGING_BRANCH }}
      vk_deploy_branch: ${{ env.VK_DEPLOY_BRANCH }}
    steps:
      - run: echo "staging branch = $STAGING_BRANCH, vk branch = $VK_DEPLOY_BRANCH"

  # ===========================================================================
  # STAGING — STAGING_BRANCH only. Builds the artifact and tags it :staging.
  # Pushes to main / live-v* skip this job — they reuse the production image
  # (see build-prod, which also tags :staging).
  # ===========================================================================
  build-staging:
    name: Build jagua image → staging
    needs: config
    if: github.ref == format('refs/heads/{0}', needs.config.outputs.staging_branch)
    concurrency:
      group: jagua-staging-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The AsyncAPI wire spec is sourced from cutl-schemas (single source of truth), not vendored.
      # Fetch it into the build context before the Docker build (build.rs/typify reads it).
      - name: Sync AsyncAPI spec from cutl-schemas
        env:
          GH_TOKEN: ${{ secrets.CUTL_SCHEMAS_TOKEN }}
        run: ./scripts/sync-schema.sh
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: docker login to VK registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.VK_REGISTRY }}
          username: ${{ secrets.VK_REGISTRY_USER }}
          password: ${{ secrets.VK_REGISTRY_PASSWORD }}
      - name: Build, tag, and push jagua image (staging)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Layer cache lives as a separate OCI artifact tag in the same ECR
          # repo (:buildcache-staging). cache-to=mode=max also stores
          # intermediate stages (apt installs, cargo dependency build), so
          # unchanged stages are reused across runs. Each environment has its
          # own cache ref so staging and prod don't fight over layer slots.
          docker buildx build --platform linux/amd64 \
            -f jagua-sqs-processor/Dockerfile \
            --cache-from=type=registry,ref=$ECR_REGISTRY/$ECR_REPOSITORY:buildcache-staging \
            --cache-to=type=registry,ref=$ECR_REGISTRY/$ECR_REPOSITORY:buildcache-staging,mode=max,image-manifest=true,oci-mediatypes=true \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:staging \
            -t $VK_REGISTRY/$VK_IMAGE:$IMAGE_TAG \
            -t $VK_REGISTRY/$VK_IMAGE:staging \
            --push .

  # ===========================================================================
  # VK CLOUD build, feature branch only. Pushes to the VK registry and NOTHING
  # else, so an unmerged branch can never affect an AWS deploy. On main /
  # live-v* this stays skipped and build-prod's dual-push supplies the image.
  # ===========================================================================
  build-vk:
    name: Build jagua image -> VK registry
    needs: config
    if: |
      github.event_name == 'push'
      && github.ref == format('refs/heads/{0}', needs.config.outputs.vk_deploy_branch)
    concurrency:
      group: jagua-vk-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # The AsyncAPI wire spec is sourced from cutl-schemas, not vendored;
      # build.rs/typify reads it out of the build context.
      - name: Sync AsyncAPI spec from cutl-schemas
        env:
          GH_TOKEN: ${{ secrets.CUTL_SCHEMAS_TOKEN }}
        run: ./scripts/sync-schema.sh
      - uses: docker/setup-buildx-action@v3
      - name: docker login to VK registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.VK_REGISTRY }}
          username: ${{ secrets.VK_REGISTRY_USER }}
          password: ${{ secrets.VK_REGISTRY_PASSWORD }}
      - name: Build, tag, and push jagua image (VK)
        env:
          VK_PROD_ENABLED: ${{ vars.VK_PROD_ENABLED }}
        run: |
          set -euo pipefail
          # ALSO the production VK registry when production deploys are enabled.
          # deploy-vk-production runs from this branch too and pulls from the
          # PRODUCTION registry only - it must never reach into staging's.
          PROD_TAGS=""
          if [ "${VK_PROD_ENABLED:-}" = "true" ]; then
            PROD_TAGS="-t $VK_REGISTRY/$VK_IMAGE:$IMAGE_TAG -t $VK_REGISTRY/$VK_IMAGE:production"
          fi
          # Cache ref lives in the VK registry so the feature branch needs no
          # ECR credentials at all.
          docker buildx build --platform linux/amd64 \
            -f jagua-sqs-processor/Dockerfile \
            --cache-from=type=registry,ref=$VK_REGISTRY/$VK_IMAGE:buildcache-vk \
            --cache-to=type=registry,ref=$VK_REGISTRY/$VK_IMAGE:buildcache-vk,mode=max,image-manifest=true,oci-mediatypes=true \
            -t $VK_REGISTRY/$VK_IMAGE:$IMAGE_TAG \
            -t $VK_REGISTRY/$VK_IMAGE:staging \
            $PROD_TAGS \
            --push .

  # ===========================================================================
  # VK CLOUD deploy. Runs ALONGSIDE the ECS deploys, not instead of them.
  # cutl-infra owns the cluster, registry and the cutl-env / registry-pull /
  # kafka-jagua-nesting Secrets; this job needs only auth material.
  # ===========================================================================
  deploy-vk-staging:
    name: Deploy jagua -> VK staging
    needs: [config, build-vk, build-prod]
    if: |
      !failure() && !cancelled()
      && github.event_name == 'push'
      && (
        github.ref == format('refs/heads/{0}', needs.config.outputs.vk_deploy_branch)
        || github.ref == 'refs/heads/main'
        || startsWith(github.ref, 'refs/tags/live-v')
      )
    concurrency:
      group: jagua-vk-staging-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: install kubectl
        run: |
          set -euo pipefail
          curl -sSLo /tmp/kubectl https://dl.k8s.io/release/v1.34.2/bin/linux/amd64/kubectl
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl

      - name: build kubeconfig from Keystone token
        env:
          VKCS_AUTH_URL:   ${{ secrets.VKCS_AUTH_URL }}
          VKCS_USERNAME:   ${{ secrets.VKCS_USERNAME }}
          VKCS_PASSWORD:   ${{ secrets.VKCS_PASSWORD }}
          VKCS_PROJECT_ID: ${{ secrets.VKCS_PROJECT_ID }}
          VK_K8S_ENDPOINT: ${{ secrets.VK_K8S_ENDPOINT }}
          VK_K8S_CA:       ${{ secrets.VK_K8S_CA }}
        run: |
          set -euo pipefail
          # A project-scoped VK Keystone token IS the Kubernetes API bearer token.
          token=$(curl -sS -D - -o /dev/null -X POST "${VKCS_AUTH_URL%/}/auth/tokens" \
            -H "Content-Type: application/json" \
            -d "{\"auth\":{\"identity\":{\"methods\":[\"password\"],\"password\":{\"user\":{\"name\":\"${VKCS_USERNAME}\",\"domain\":{\"name\":\"users\"},\"password\":\"${VKCS_PASSWORD}\"}}},\"scope\":{\"project\":{\"id\":\"${VKCS_PROJECT_ID}\"}}}}" \
            | grep -i '^x-subject-token:' | tr -d '\r' | awk '{print $2}')
          if [ -z "$token" ]; then
            echo "::error::Failed to obtain a Keystone token (check VKCS_* secrets)."
            exit 1
          fi
          echo "::add-mask::$token"

          mkdir -p "$HOME/.kube"
          cat > "$HOME/.kube/config" <<EOF
          apiVersion: v1
          kind: Config
          clusters:
          - name: vk
            cluster:
              server: ${VK_K8S_ENDPOINT}
              certificate-authority-data: ${VK_K8S_CA}
          contexts:
          - name: vk
            context:
              cluster: vk
              user: vk
              namespace: cutl
          current-context: vk
          users:
          - name: vk
            user:
              token: ${token}
          EOF
          chmod 600 "$HOME/.kube/config"

      # BEFORE the manifests: the Deployment's envFrom references this Secret,
      # and a missing envFrom target leaves the pod in
      # CreateContainerConfigError instead of failing with a clear message.
      #
      # Same shape as cutl-backend's "create application secret" step. These are
      # the ECS credentials (s3-upload-user) because VK provides no task role -
      # see the Deployment for the full reasoning.
      - name: create S3 credentials secret
        env:
          S3_SECRETS: ${{ secrets.VK_S3_SECRETS }}
        run: |
          set -euo pipefail
          if [ -z "${S3_SECRETS:-}" ]; then
            echo "::error::VK_S3_SECRETS is unset. Nesting downloads read from S3, so the worker would start and then fail every job into the retry ladder. Set it by running cutl-infra scripts/vk-github-secrets.sh."
            exit 1
          fi
          # --from-env-file reads KEY=VALUE lines, the format it was extracted
          # in, so the value transfers unchanged.
          printf '%s' "$S3_SECRETS" > /tmp/s3-secrets.env
          kubectl -n cutl create secret generic jagua-s3-secrets \
            --from-env-file=/tmp/s3-secrets.env \
            --dry-run=client -o yaml | kubectl apply --server-side --force-conflicts -f -
          shred -u /tmp/s3-secrets.env 2>/dev/null || rm -f /tmp/s3-secrets.env

      - name: render + apply manifests
        env:
          IMAGE: ${{ env.VK_REGISTRY }}/${{ env.VK_IMAGE }}:${{ github.sha }}
          DEPLOYMENT_ENV: staging
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rendered=/tmp/jagua-manifests.yaml
          : > "$rendered"
          for f in deploy/k8s/deployment-staging.yaml deploy/k8s/service-staging.yaml; do
            envsubst '${IMAGE} ${DEPLOYMENT_ENV} ${GIT_SHA}' < "$f" >> "$rendered"
            echo '---' >> "$rendered"
          done
          kubectl apply --server-side --force-conflicts --dry-run=server -f "$rendered"
          kubectl apply --server-side --force-conflicts -f "$rendered"

      - name: wait for rollout
        # Generous: terminationGracePeriodSeconds is 600, so a Recreate rollout
        # waits for an in-flight nesting job to drain before the new pod starts.
        run: kubectl -n cutl rollout status deployment/jagua --timeout=15m

      - name: post-deploy snapshot
        if: always()
        run: |
          set +e
          echo "=== pods ==="
          kubectl -n cutl get pods -o wide
          echo "=== warnings ==="
          kubectl -n cutl get events --field-selector type=Warning --sort-by=.lastTimestamp | tail -30

  deploy-staging:
    name: Deploy jagua → staging
    # Runs after whichever build produced the :staging tag — build-staging on a
    # STAGING_BRANCH push, or build-prod on main / live-v* (which tags the same
    # image as :staging too). `!failure() && !cancelled()` lets us tolerate the
    # always-skipped sibling build job. `config` is in needs so `if:` below can
    # read its staging_branch output.
    needs: [config, build-staging, build-prod]
    if: |
      !failure() && !cancelled()
      && github.event_name == 'push'
      && (
        github.ref == format('refs/heads/{0}', needs.config.outputs.staging_branch)
        || github.ref == 'refs/heads/main'
        || startsWith(github.ref, 'refs/tags/live-v')
      )
    concurrency:
      group: jagua-staging-deploy
      cancel-in-progress: false
    environment:
      name: staging
      url: https://eu-north-1.console.aws.amazon.com/ecs/v2/clusters/CUTLStagingCluster/services/CUTLStagingJaguaSqsProcessorService
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ECS_CLUSTER: CUTLStagingCluster
      ECS_SERVICE: CUTLStagingJaguaSqsProcessorService
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new ECS deployment (staging)
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment

  # ===========================================================================
  # PRODUCTION — main branch or live-v* tag only.
  # Independent concurrency group; a staging push never cancels a prod deploy.
  # Tags the built image as :staging too so deploy-staging can roll the same
  # artifact to staging in parallel (see comment on deploy-staging).
  # ===========================================================================
  build-prod:
    name: Build jagua image → production
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/live-v')
    concurrency:
      group: jagua-prod-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The AsyncAPI wire spec is sourced from cutl-schemas (single source of truth), not vendored.
      # Fetch it into the build context before the Docker build (build.rs/typify reads it).
      - name: Sync AsyncAPI spec from cutl-schemas
        env:
          GH_TOKEN: ${{ secrets.CUTL_SCHEMAS_TOKEN }}
        run: ./scripts/sync-schema.sh
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: docker login to VK registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.VK_REGISTRY }}
          username: ${{ secrets.VK_REGISTRY_USER }}
          password: ${{ secrets.VK_REGISTRY_PASSWORD }}
      - name: Build, tag, and push jagua image (production)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          VK_PROD_ENABLED: ${{ vars.VK_PROD_ENABLED }}
        run: |
          # ONE BUILD, PUSHED TO EVERY REGISTRY THAT NEEDS IT. The production VK
          # tags are added here rather than copied later out of the staging
          # registry: copying would make a production deploy depend on staging
          # being alive, and staging is destroyed when idle (RFC-001 section 9).
          # A single buildx build emits one manifest and pushes it to every tag,
          # so artifact identity is preserved exactly as a copy would.
          PROD_TAGS=""
          if [ "${VK_PROD_ENABLED:-}" = "true" ]; then
            PROD_TAGS="-t $VK_REGISTRY/$VK_IMAGE:$IMAGE_TAG -t $VK_REGISTRY/$VK_IMAGE:production"
          fi
          # Layer cache lives as :buildcache-prod in the same ECR repo (kept
          # separate from staging so the two pipelines don't evict each
          # other's intermediates). cache-from also reads :buildcache-staging
          # as a fallback so a fresh prod build right after a staging build
          # of the same SHA hits warm layers.
          docker buildx build --platform linux/amd64 \
            -f jagua-sqs-processor/Dockerfile \
            --cache-from=type=registry,ref=$ECR_REGISTRY/$ECR_REPOSITORY:buildcache-prod \
            --cache-from=type=registry,ref=$ECR_REGISTRY/$ECR_REPOSITORY:buildcache-staging \
            --cache-to=type=registry,ref=$ECR_REGISTRY/$ECR_REPOSITORY:buildcache-prod,mode=max,image-manifest=true,oci-mediatypes=true \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:production \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:staging \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t $VK_REGISTRY/$VK_IMAGE:$IMAGE_TAG \
            -t $VK_REGISTRY/$VK_IMAGE:production \
            $PROD_TAGS \
            --push .

  deploy-prod:
    name: Deploy jagua → production
    needs: build-prod
    if: github.event_name == 'push'
    concurrency:
      group: jagua-prod-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://eu-north-1.console.aws.amazon.com/ecs/v2/clusters/CUTL-prodProductionCluster/services/CUTL-prodProductionJaguaSqsProcessorService
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ECS_CLUSTER: CUTL-prodProductionCluster
      ECS_SERVICE: CUTL-prodProductionJaguaSqsProcessorService
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new ECS deployment (production)
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment

  # ===========================================================================
  # VK CLOUD PRODUCTION. Copies the already-built image into the production VK
  # registry and rolls the production nesting worker.
  #
  # OFF UNTIL THE REPOSITORY VARIABLE VK_PROD_ENABLED IS 'true'. The production
  # VK project does not exist yet; without the gate every push to main would
  # fail here for a reason that has nothing to do with the commit.
  #
  # TWO REPLICAS, where staging runs one. Safe because Kafka's partition
  # assignment gives each message exactly one owner within a consumer group;
  # see the long comment in deploy/k8s/deployment-production.yaml.
  # ===========================================================================
  deploy-vk-production:
    name: Deploy jagua -> VK production
    # build-vk MUST be here. It is the job that produces the image on the
    # vk-cloud branch; build-prod only runs on main / live-v*. Without it the
    # deploy could start before the image exists and fail on a missing tag.
    # `!failure() && !cancelled()` below tolerates whichever of the two is
    # skipped for the current ref.
    needs: [config, build-vk, build-prod]
    if: |
      !failure() && !cancelled()
      && vars.VK_PROD_ENABLED == 'true'
      && github.event_name == 'push'
      && (
        github.ref == format('refs/heads/{0}', needs.config.outputs.vk_deploy_branch)
        || github.ref == 'refs/heads/main'
        || startsWith(github.ref, 'refs/tags/live-v')
      )
    concurrency:
      group: jagua-vk-production-deploy
      # Never cancel a rollout in flight: the worker drains for up to 600s and
      # interrupting that is how in-flight nesting jobs get lost.
      cancel-in-progress: false
    # Resolves the VKCS_* / VK_K8S_* / VK_*REGISTRY* / VK_S3_SECRETS values to
    # the PRODUCTION project's. Same secret NAMES as staging, different values,
    # selected by the environment. Add required reviewers here in the GitHub UI
    # to gate production deploys on approval.
    environment:
      name: production-vk
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: install kubectl
        run: |
          set -euo pipefail
          curl -sSLo /tmp/kubectl https://dl.k8s.io/release/v1.34.2/bin/linux/amd64/kubectl
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl

      # NOTHING HERE TOUCHES THE STAGING REGISTRY. build-prod already pushed this
      # sha straight to the production registry, so this job only talks to
      # production: its registry, its cluster, its secrets.
      - name: build kubeconfig from Keystone token
        env:
          VKCS_AUTH_URL:   ${{ secrets.VKCS_AUTH_URL }}
          VKCS_USERNAME:   ${{ secrets.VKCS_USERNAME }}
          VKCS_PASSWORD:   ${{ secrets.VKCS_PASSWORD }}
          VKCS_PROJECT_ID: ${{ secrets.VKCS_PROJECT_ID }}
          VK_K8S_ENDPOINT: ${{ secrets.VK_K8S_ENDPOINT }}
          VK_K8S_CA:       ${{ secrets.VK_K8S_CA }}
        run: |
          set -euo pipefail
          token=$(curl -sS -D - -o /dev/null -X POST "${VKCS_AUTH_URL%/}/auth/tokens" \
            -H "Content-Type: application/json" \
            -d "{\"auth\":{\"identity\":{\"methods\":[\"password\"],\"password\":{\"user\":{\"name\":\"${VKCS_USERNAME}\",\"domain\":{\"name\":\"users\"},\"password\":\"${VKCS_PASSWORD}\"}}},\"scope\":{\"project\":{\"id\":\"${VKCS_PROJECT_ID}\"}}}}" \
            | grep -i '^x-subject-token:' | tr -d '\r' | awk '{print $2}')
          if [ -z "$token" ]; then
            echo "::error::Failed to obtain a Keystone token. Check the production-vk environment's VKCS_* secrets — these must be the PRODUCTION project's, not staging's."
            exit 1
          fi
          echo "::add-mask::$token"

          mkdir -p "$HOME/.kube"
          cat > "$HOME/.kube/config" <<EOF
          apiVersion: v1
          kind: Config
          clusters:
          - name: vk
            cluster:
              server: ${VK_K8S_ENDPOINT}
              certificate-authority-data: ${VK_K8S_CA}
          contexts:
          - name: vk
            context:
              cluster: vk
              user: vk
              namespace: cutl
          current-context: vk
          users:
          - name: vk
            user:
              token: ${token}
          EOF
          chmod 600 "$HOME/.kube/config"

      # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for S3. VK has no ECS agent, no
      # instance profile and no IRSA, so the SDK's credential chain finds nothing
      # and every S3 call fails before it is made — which is exactly what this
      # pod printed on its first VK run: `AWS_ACCESS_KEY_ID: Err(NotPresent)`.
      - name: create the S3 credential secret
        env:
          S3_SECRETS: ${{ secrets.VK_S3_SECRETS }}
        run: |
          set -euo pipefail
          if [ -z "${S3_SECRETS:-}" ]; then
            echo "::error::VK_S3_SECRETS is unset on the production-vk environment. Every S3 read and write will fail with a credential-chain error. Populate it via cutl-infra scripts/vk-github-secrets.sh production."
            exit 1
          fi
          printf '%s' "$S3_SECRETS" > /tmp/s3-secrets.env
          kubectl -n cutl create secret generic jagua-s3-secrets \
            --from-env-file=/tmp/s3-secrets.env \
            --dry-run=client -o yaml | kubectl apply --server-side --force-conflicts -f -
          shred -u /tmp/s3-secrets.env 2>/dev/null || rm -f /tmp/s3-secrets.env

      - name: render + apply manifests
        env:
          IMAGE: ${{ env.VK_REGISTRY }}/${{ env.VK_IMAGE }}:${{ github.sha }}
          DEPLOYMENT_ENV: production
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rendered=/tmp/jagua-production-manifests.yaml
          : > "$rendered"
          # NAMED EXPLICITLY, never a glob: deploy/k8s/ holds the staging
          # manifests too, and a glob here would apply them to production.
          for f in deploy/k8s/deployment-production.yaml deploy/k8s/service-production.yaml; do
            envsubst '${IMAGE} ${DEPLOYMENT_ENV} ${GIT_SHA}' < "$f" >> "$rendered"
            echo '---' >> "$rendered"
          done
          kubectl apply --server-side --force-conflicts --dry-run=server -f "$rendered"
          kubectl apply --server-side --force-conflicts -f "$rendered"

      # Generous: maxUnavailable is 1 and each pod drains for up to 600s, so a
      # two-replica rollout is two grace periods back to back.
      - name: wait for rollout
        run: kubectl -n cutl rollout status deployment/jagua --timeout=25m

      - name: diagnose a failed rollout
        if: failure()
        run: |
          set +e
          kubectl -n cutl get pods -o wide -l app.kubernetes.io/name=jagua
          kubectl -n cutl describe pods -l app.kubernetes.io/name=jagua | sed -n '/Events:/,$p'
          kubectl -n cutl logs -l app.kubernetes.io/name=jagua --tail=120 --all-containers --prefix
          kubectl -n cutl get events --field-selector type=Warning --sort-by=.lastTimestamp | tail -30

      - name: post-deploy snapshot
        if: always()
        run: |
          set +e
          kubectl -n cutl get pods -o wide -l app.kubernetes.io/name=jagua
