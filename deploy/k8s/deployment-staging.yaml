# jagua-nesting is an INTERNAL worker. It has no Ingress and no public
# hostname: nothing outside the cluster addresses it, and work reaches it over
# the message bus. The Service below exists only so Prometheus has something to
# select — it is not a traffic path.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jagua
  namespace: cutl
  labels:
    app.kubernetes.io/name: jagua
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: cutl
spec:
  replicas: 1
  # Recreate, not RollingUpdate. A nesting job is long-running and single-owner;
  # two replicas of different versions competing for the same messages during a
  # rollout is not something the processor is written to expect.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jagua
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jagua
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: cutl
    spec:
      imagePullSecrets:
        # Created by cutl-infra modules-vk/k8s-workload kubernetes_secret.image_pull.
        - name: registry-pull
      # A nesting run can be minutes long. The default 30s would SIGKILL a job
      # mid-flight on every rollout, losing the work with no record of it — and
      # since retries are the only recovery (there is no DLQ, RFC-001), that is
      # a silent loss. main.rs handles SIGTERM and drains via the shutdown
      # channel; this gives it room to finish.
      terminationGracePeriodSeconds: 600
      containers:
        - name: jagua
          # ${IMAGE} is substituted by envsubst in the deploy workflow.
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          envFrom:
            # Postgres/Valkey/Kafka bootstrap, written by cutl-infra
            # modules-vk/k8s-workload kubernetes_secret.cutl_env.
            - secretRef:
                name: cutl-env
            # This worker's OWN Kafka SCRAM credentials, copied into this
            # namespace per consumer group by modules-vk/kafka-credentials.
            # Mounting only its own group is the point of the per-group users:
            # jagua cannot read another worker's topics.
            #
            # Present from T7 so connectivity can be proven before the code
            # depends on it — the SQS-to-Kafka switch itself is T9.
            - secretRef:
                name: kafka-jagua-nesting
          env:
            - name: HEALTH_PORT
              value: "8080"
            # Tempo's OTLP receiver. observability.rs treats an unset value as
            # "log to stdout only" rather than an error, so local and ECS runs
            # are unaffected.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.monitoring.svc.cluster.local:4318"
            - name: RUST_LOG
              value: "info"
            - name: DEPLOYMENT_ENV
              value: "${DEPLOYMENT_ENV}"
            - name: GIT_SHA
              value: "${GIT_SHA}"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # This binary had no HTTP server at all before T7. Without these a
          # wedged worker keeps its pod Ready forever and just stops consuming,
          # which is precisely the gap the tws worker documents as known and
          # unaddressed.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            # /health answers as long as the process is alive and is NOT gated
            # on readiness state. Deliberate: a failing dependency should stop
            # traffic, not trigger a restart loop that cannot fix it.
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            # Nesting is CPU-bound; memory is modest. Mirrors the ECS task
            # sizing, using the non-ARM values since VK nodes are amd64.
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
