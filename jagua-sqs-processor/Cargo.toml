[package]
name = "jagua-sqs-processor"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "SQS queue processor for jagua-rs SVG nesting service"
authors = ["Jeroen Gardeyn"]
repository = "https://github.com/JeroenGar/jagua-rs"
homepage = "https://github.com/JeroenGar/jagua-rs"

[[bin]]
name = "jagua-sqs-processor"
path = "src/main.rs"

[dependencies]
jagua-utils = { path = "../jagua-utils" }
aws-sdk-s3 = "1.0"
aws-config = "1.0"

# ── Kafka transport (VK migration T9) ──
# Replaces aws-sdk-sqs: `sqs.eu-north-1` is 0/6 reachable from a VK pod while
# `cutl-kafka-bootstrap.kafka.svc:9092` is 6/6. rdkafka wraps librdkafka, which is
# the only Rust client with real consumer groups, SCRAM auth and pause/resume —
# rskafka has no group coordination and kafka-rust has no SASL.
#
# `cmake-build` builds the vendored librdkafka with CMake (the Dockerfile builder
# stage installs cmake for exactly this). `ssl` is NOT optional even though the VK
# listener is plaintext: librdkafka implements SCRAM's HMAC via OpenSSL, so without
# it SCRAM-SHA-512 is compiled out and auth fails at runtime, not at build time.
rdkafka = { version = "0.37", default-features = false, features = [
    "cmake-build",
    "tokio",
    "ssl",
    "sasl",
    "libz",
] }

# Prometheus metrics. `cutl_retries_exhausted_total` is the ONLY signal a message
# was lost (there is no DLQ by design) and cutl-infra already ships the alert, so
# this is a correctness requirement rather than instrumentation.
# default-features off drops the `protobuf`/push-gateway path; we only ever serve
# the text exposition format over the axum router that already exists.
prometheus = { version = "0.13", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
anyhow = { workspace = true }
log = { workspace = true }
base64 = "0.21"
env_logger = "0.11"
async-trait = "0.1"

# ── Health/readiness endpoints and tracing (VK migration T7) ──
# This binary had NO HTTP server at all. Kubernetes needs one: without probes a
# wedged worker keeps its pod Ready forever and simply stops consuming, which is
# exactly the failure the tws worker documents as a known gap. axum is the
# smallest thing that serves two routes on the tokio runtime already here.
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }

# Tracing from scratch: only `log`/env_logger existed. tracing-subscriber's
# default `tracing-log` feature bridges the existing log::info! calls into
# tracing, so this is additive and no call site changes. Do NOT also depend on
# tracing-log directly and call LogTracer::init() — that claims the global
# logger and makes subscriber init panic.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-opentelemetry = "0.28"
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["http-proto", "reqwest-client"] }
opentelemetry-semantic-conventions = "0.27"

[build-dependencies]
# Wire types are generated at build time from the vendored AsyncAPI spec
# (asyncapi/jagua-rs.yaml) by build.rs. typify needs schemars 0.8 (its pinned major).
typify = "0.7"
schemars = "0.8.22"
serde_yaml = "0.9"
serde_json = { workspace = true }
prettyplease = "0.2"
syn = "2"

[dev-dependencies]
tokio-test = "0.4"
regex = "1"
# Integration tests drive the docker-compose harness (Kafka + MinIO) over HTTP for
# the /metrics scrape assertions; the Kafka side uses rdkafka directly.
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[lints.rust]
warnings = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
too_many_arguments = "allow"
type_complexity = "allow"
