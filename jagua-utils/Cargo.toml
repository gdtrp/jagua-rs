[package]
name = "jagua-utils"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Utility functions for jagua-rs, including SVG nesting utilities"
authors = ["Jeroen Gardeyn"]
repository = "https://github.com/JeroenGar/jagua-rs"
homepage = "https://github.com/JeroenGar/jagua-rs"

[dependencies]
jagua-rs = { path = "../jagua-rs", features = ["bpp"] }
lbf = { path = "../lbf" }
rand = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
regex = "1"
rayon = { workspace = true }
geo = "0.24"
geo-buffer = { workspace = true }

[dev-dependencies]
env_logger = { workspace = true }
serde_json = { workspace = true }

[features]
# Opt-in for the long-running nesting tests (real LBF packing, minutes on a 2-core
# CI runner). Tests carry `#[cfg_attr(not(feature = "slow-tests"), ignore = ...)]`,
# so a plain `cargo test` skips them (they show as "ignored") and the CI `test`
# job stays fast; `make test-slow` / the nightly `slow` CI job enable the feature.
slow-tests = []

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
too_many_arguments = "allow"
type_complexity = "allow"
